name: Windows preview
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [owner-pr-merged]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Audit and publish Windows x64
        shell: pwsh
        run: |
          dotnet restore windows/Nashi.Windows --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/Nashi.Windows -c Release --no-restore -o build/windows/Nashi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified media tools and exercise real exports
        shell: pwsh
        env:
          NASHI_VERIFY_DOWNLOAD_TOOLS: '1'
          NASHI_VERIFY_TOOLS_DIRECTORY: '${{ runner.temp }}\Nashi-Test-Tools'
        run: |
          dotnet run --project windows/Nashi.Verify -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows native image PDF ZIP and WPF render checks
        shell: pwsh
        env:
          NASHI_SMOKE_DIRECTORY: '${{ github.workspace }}\build\windows-smoke'
        run: |
          $proof = $env:NASHI_SMOKE_DIRECTORY
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /d /c "call `"$vcvars`" && cl /nologo /std:c++20 /EHsc /W4 /DNASHI_TRACE_LIBRARY /LD windows\Diagnostics\NativeDebugRunner.cpp /Fe:build\NativeShutdownTrace.dll && cl /nologo /std:c++20 /EHsc /W4 windows\Diagnostics\NativeDebugRunner.cpp /Fe:build\NativeDebugRunner.exe /link dbghelp.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostics did not compile' }
          function Invoke-NativeFixture([string] $directory) {
            $env:NASHI_SMOKE_DIRECTORY = $directory
            New-Item -ItemType Directory -Force $directory | Out-Null
            $start = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path build/windows/Nashi/Nashi.exe))
            $start.UseShellExecute = $false
            $start.ArgumentList.Add('--smoke-test')
            $process = [System.Diagnostics.Process]::Start($start)
            try {
              $processHandle = $process.Handle
              if (!$process.WaitForExit(900000)) {
                $process.Kill($true)
                throw 'Native desktop checks exceeded 15 minutes'
              }
              Write-Host "Native desktop process exit code: $($process.ExitCode); fixture: $directory"
              return $process.ExitCode
            } finally { $process.Dispose() }
          }
          $env:NASHI_NATIVE_TRACE_LIBRARY = (Resolve-Path build/NativeShutdownTrace.dll).Path
          $exitCode = Invoke-NativeFixture $proof
          if ($exitCode -eq 0) {
            Remove-Item Env:NASHI_NATIVE_TRACE_LIBRARY
            $exitCode = Invoke-NativeFixture (Join-Path $proof 'second-pass')
          }
          if ($exitCode -ne 0) {
            $hasFrames = $false
            Get-ChildItem $proof -Filter native-exception-stack.txt -Recurse | ForEach-Object {
              if ((Get-Content $_.FullName -Raw) -match "FRAME\t") {
                $hasFrames = $true
                & build/NativeDebugRunner.exe --resolve-stack $_.FullName | Tee-Object -FilePath ($_.FullName + '.resolved.txt')
              }
            }
            if (!$hasFrames) {
              $env:NASHI_SMOKE_DIRECTORY = Join-Path $proof 'native-debug'
              New-Item -ItemType Directory -Force $env:NASHI_SMOKE_DIRECTORY | Out-Null
              & build/NativeDebugRunner.exe (Resolve-Path build/windows/Nashi/Nashi.exe) --smoke-test 2>&1 | Tee-Object -FilePath (Join-Path $proof 'native-stack.txt')
            }
            Start-Sleep -Seconds 3
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001,1026; StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue | Select-Object -First 8 TimeCreated,ProviderName,Id,Message | Format-List | Out-String | Write-Host
            throw "Native desktop checks exited with code $exitCode"
          }
          foreach ($directory in @($proof, (Join-Path $proof 'second-pass'))) {
            if (!(Test-Path (Join-Path $directory 'smoke.json'))) { throw 'No native smoke result' }
            Get-Content (Join-Path $directory 'smoke.json')
          }
      - name: Focused interaction completion and timeout recovery
        shell: pwsh
        run: |
          foreach ($fixture in @(
            @{Name='focused'; Arguments=@('--smoke-test-interactions'); ExitCode=0},
            @{Name='focused-timeout'; Arguments=@('--smoke-test-interactions','--timeout-seconds','1'); ExitCode=1}
          )) {
            $directory = Join-Path '${{ github.workspace }}\build\windows-smoke' $fixture.Name
            New-Item -ItemType Directory -Force $directory | Out-Null
            $start = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path build/windows/Nashi/Nashi.exe))
            $start.UseShellExecute = $false
            $start.Environment['NASHI_SMOKE_DIRECTORY'] = $directory
            foreach ($argument in $fixture.Arguments) { $start.ArgumentList.Add($argument) }
            $process = [System.Diagnostics.Process]::Start($start)
            try {
              if (!$process.WaitForExit(150000)) { $process.Kill($true); throw 'Focused interaction process did not terminate' }
              if ($process.ExitCode -ne $fixture.ExitCode) { throw "Unexpected focused interaction exit code: $($process.ExitCode)" }
              $report = Get-Content (Join-Path $directory 'interactions.json') -Raw | ConvertFrom-Json
              if ($fixture.ExitCode -eq 0 -and ($report.checks -lt 21 -or $report.failures.Count -ne 0)) { throw 'Focused interactions did not complete' }
              if ($fixture.ExitCode -eq 1 -and $report.failures -notcontains 'Focused native interaction checks timed out.') { throw 'No timeout failure report' }
              Write-Host "$($fixture.Name): exit=$($process.ExitCode); checks=$($report.checks); failures=$($report.failures.Count)"
            } finally { $process.Dispose() }
          }
      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/Nashi/* -DestinationPath build/Nashi-Windows-x64.zip
          Get-FileHash build/Nashi-Windows-x64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-preview
          path: |
            build/Nashi-Windows-x64.zip
            build/windows-smoke
          retention-days: 7
          if-no-files-found: error
