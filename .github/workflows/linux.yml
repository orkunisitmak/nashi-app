name: Linux preview
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [owner-pr-merged]
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Restore engine verifier
        shell: bash
        run: dotnet restore windows/Nashi.Verify --locked-mode
      - name: Run engine checks
        shell: bash
        env:
          NASHI_VERIFY_DOWNLOAD_TOOLS: '1'
          NASHI_VERIFY_TOOLS_DIRECTORY: ${{ runner.temp }}/Nashi-Test-Tools
        run: dotnet run --project windows/Nashi.Verify -c Release
      - name: Restore Linux app
        shell: bash
        run: |
          dotnet restore linux/Nashi.Linux --locked-mode
          dotnet restore linux/Nashi.Linux.Checks --locked-mode
      - name: Run Linux app checks
        shell: bash
        env:
          NASHI_SMOKE_DIRECTORY: ${{ runner.temp }}/Nashi-Linux-Smoke
          NASHI_VERIFY_FFMPEG: ${{ runner.temp }}/Nashi-Test-Tools/ffmpeg
          NASHI_VERIFY_FFPROBE: ${{ runner.temp }}/Nashi-Test-Tools/ffprobe
        run: dotnet run --project linux/Nashi.Linux.Checks -c Release
      - name: Upload Linux smoke screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-smoke
          path: ${{ runner.temp }}/Nashi-Linux-Smoke
          if-no-files-found: ignore
      - name: Build AppImage
        shell: bash
        run: bash scripts/build-linux-appimage.sh
      - name: Check AppImage version
        shell: bash
        run: |
          expected=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' windows/Directory.Build.props)
          actual=$(APPIMAGE_EXTRACT_AND_RUN=1 ./build/linux/Nashi-Linux-x86_64.AppImage --version)
          test "$actual" = "$expected" || { echo "got '$actual', want '$expected'" >&2; exit 1; }
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/build/linux/Nashi-Linux-x86_64.AppImage" --appimage-extract >/dev/null)
          for f in LICENSE THIRD-PARTY-NOTICES.txt Magick.NET-THIRD-PARTY-NOTICES.txt; do
            test -s "$RUNNER_TEMP/squashfs-root/usr/share/doc/nashi/$f"
          done
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Nashi-Linux-x86_64
          path: |
            build/linux/Nashi-Linux-x86_64.AppImage
            build/linux/Nashi-Linux-x86_64.AppImage.sha256
          if-no-files-found: error
